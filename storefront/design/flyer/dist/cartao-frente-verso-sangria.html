*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#3a3a40}
body.sheet{background:#ffffff}
.art{
  position:relative;overflow:hidden;
  background-color:#1355b3;color:#ffffff;
  font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;
  padding:var(--bleed);
}
.art.grain::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 88% 16%, rgba(246,85,155,.70) 0%, rgba(246,85,155,0) 46%),
    radial-gradient(circle at 4% 88%, rgba(47,116,216,.85) 0%, rgba(47,116,216,0) 40%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.075) 0 0.45mm, transparent 0.45mm 8mm);
}
.art.grain::after{
  content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(180deg, rgba(11,11,12,.10) 0 0.18mm, transparent 0.18mm 0.62mm);
}
.trim{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.wordmark{
  font-family:"Baloo 2",sans-serif;font-weight:800;line-height:.9;letter-spacing:-.01em;
  text-shadow:0.5mm 0.5mm 0 #1355b3, 0.95mm 0.95mm 0 #0b0b0c;
}
.pixel{font-family:"Press Start 2P",monospace;font-weight:400;line-height:1}
.disc{
  border-radius:999px;overflow:hidden;
  border:0.8mm solid #0b0b0c;background:#2f74d8;
}
.disc img{width:100%;height:100%;object-fit:cover;display:block}


.sheet{width:210mm;height:297mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sheet .art{--bleed:0mm}
.grid{outline:0.2mm solid #cfcfcf}
.cutgap{gap:0}


.flyer{width:calc(105mm + 2 * var(--bleed));height:calc(148mm + 2 * var(--bleed))}
.flyer .band{
  background:#0b0b0c;color:#fdc4e5;
  font-family:"Press Start 2P",monospace;font-size:1.5mm;line-height:1;letter-spacing:.02em;
  padding:calc(1.9mm + var(--bleed)) 2mm 1.9mm;
  margin:calc(-1 * var(--bleed)) calc(-1 * var(--bleed)) 0;
  display:flex;align-items:center;justify-content:center;gap:2mm;
}
.flyer .band .dot{width:1.1mm;height:1.1mm;border-radius:999px;background:#f6559b}
.flyer .body{flex:1;display:flex;flex-direction:column;padding:5.5mm 7mm 0}
.flyer .brandrow{display:flex;align-items:center;gap:2.2mm}
.flyer .badge{
  width:9.6mm;height:9.6mm;flex:none;border-width:0.7mm;
  box-shadow:1mm 1mm 0 #f6559b;
}
.flyer .wordmark{font-size:6.6mm}
.flyer .sep{
  margin-left:auto;text-align:right;
  font-family:"Press Start 2P",monospace;font-size:1.35mm;line-height:1.5;color:#fdc4e5;
}
.flyer .tag{
  align-self:flex-start;margin-top:4mm;
  background:#fdc4e5;color:#0b0b0c;
  font-family:"Press Start 2P",monospace;font-size:1.6mm;line-height:1;
  padding:1.5mm 1.9mm;border:0.55mm solid #0b0b0c;border-radius:1.1mm;
  box-shadow:0.85mm 0.85mm 0 #0b0b0c;
}
.flyer .hero{
  font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:13.4mm;line-height:1;letter-spacing:-.02em;margin-top:2mm;
  text-shadow:0.85mm 0.85mm 0 #f6559b, 1.6mm 1.6mm 0 #0b0b0c;
}
.flyer .lead{margin-top:3mm;max-width:82mm;font-size:2.6mm;line-height:1.5;color:#fdc4e5;font-weight:500}
.flyer .lead b{color:#ffffff;font-weight:700}
.flyer .coupon{
  position:relative;margin-top:4mm;background:#f6559b;
  border:0.8mm solid #0b0b0c;border-radius:1.8mm;box-shadow:1.6mm 1.6mm 0 #0b0b0c;
  padding:2.8mm 3mm 3mm;transform:rotate(-1.2deg);
  display:flex;align-items:center;gap:3.2mm;
}
.flyer .coupon-left{flex:none}
.flyer .coupon-kicker{font-family:"Press Start 2P",monospace;font-size:1.35mm;line-height:1;color:#0b0b0c}
.flyer .off{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:11mm;line-height:1;
  margin-top:1.2mm;letter-spacing:-.03em;text-shadow:0.75mm 0.75mm 0 #0b0b0c;
}
.flyer .off span{font-size:6.2mm;letter-spacing:-.01em}
.flyer .code{
  flex:1;background:#ffffff;color:#0b0b0c;
  border:0.5mm dashed #0b0b0c;border-radius:1mm;padding:2mm 1.4mm;text-align:center;
  font-family:"Press Start 2P",monospace;font-size:3.15mm;line-height:1;letter-spacing:.01em;
}
.flyer .code em{
  display:block;font-style:normal;font-family:"DM Sans",sans-serif;font-weight:700;
  font-size:1.8mm;letter-spacing:.16em;margin-bottom:1.4mm;color:#8a3f68;
}
.flyer .mid{display:flex;align-items:center;gap:3mm;margin-top:auto;padding-top:2.5mm}
.flyer .perks{list-style:none;display:flex;flex-direction:column;gap:2.2mm;flex:1}
.flyer .perks li{display:flex;align-items:center;gap:1.8mm;font-size:2.45mm;line-height:1.15;font-weight:700}
.flyer .perks li::before{
  content:"";width:1.8mm;height:1.8mm;flex:none;
  background:#f6559b;border:0.35mm solid #0b0b0c;border-radius:0.35mm;
}
.flyer .mascot{position:relative;flex:none;width:27mm;height:27mm}
.flyer .mascot .disc{width:27mm;height:27mm;box-shadow:1.5mm 1.5mm 0 #f6559b}
.flyer .mascot .sticker{
  position:absolute;left:-3.6mm;bottom:-2.8mm;transform:rotate(-6deg);
  background:#ffffff;color:#0b0b0c;
  font-family:"Press Start 2P",monospace;font-size:1.5mm;line-height:1;
  padding:1.4mm 1.6mm;border:0.5mm solid #0b0b0c;border-radius:1mm;box-shadow:0.8mm 0.8mm 0 #0b0b0c;
}
.flyer .qrrow{display:flex;align-items:center;gap:3.2mm;padding:3mm 0 3.5mm}
.flyer .qrbox{
  width:20mm;height:20mm;flex:none;background:#ffffff;
  border:0.7mm solid #0b0b0c;border-radius:1.1mm;box-shadow:1.2mm 1.2mm 0 #0b0b0c;padding:1.3mm;
}
.flyer .qrbox svg{display:block}
.flyer .qrtext .url{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:4.6mm;line-height:1.05;
  text-shadow:0.45mm 0.45mm 0 #0b0b0c;
}
.flyer .qrtext p{margin-top:1.2mm;font-size:2.3mm;line-height:1.35;color:#fdc4e5;font-weight:500}
.flyer .steps{
  background:#0b0b0c;margin:0 calc(-1 * var(--bleed)) calc(-1 * var(--bleed));
  padding:2.6mm 4mm calc(2.6mm + var(--bleed));
  display:flex;flex-direction:column;align-items:center;gap:1.7mm;
}
.flyer .steps .row{
  display:flex;align-items:center;justify-content:center;gap:2.4mm;
  font-family:"Press Start 2P",monospace;font-size:1.4mm;line-height:1.3;color:#fdc4e5;
}
.flyer .steps .n{color:#f6559b}
.flyer .steps .fine{font-family:"DM Sans",sans-serif;font-size:1.95mm;color:#9a9aa2;font-weight:500}
.flyer .steps .fine b{color:#ffffff;font-weight:700}


.card{
  width:calc(90mm + 2 * var(--bleed));height:calc(50mm + 2 * var(--bleed));
  background-color:#0b0b0c;padding:calc(var(--bleed) + 2.6mm);
}
.card .face{
  position:relative;z-index:2;height:100%;overflow:hidden;
  border:0.7mm solid #0b0b0c;border-radius:2.2mm;
  background-color:#1355b3;
  display:flex;flex-direction:column;
}
.card .face::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 86% 14%, rgba(246,85,155,.62) 0%, rgba(246,85,155,0) 54%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 0.4mm, transparent 0.4mm 6mm);
}
.card .plate{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:2.4mm}

.card .head{display:flex;align-items:center;gap:2mm}
.card .head .name{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:5.4mm;line-height:1;
  letter-spacing:-.01em;text-shadow:0.4mm 0.4mm 0 #1355b3, 0.8mm 0.8mm 0 #0b0b0c;
}
.card .head .pips{margin-left:auto;display:flex;gap:1.1mm}
.card .head .pips i{
  width:2.2mm;height:2.2mm;transform:rotate(45deg);
  background:#f6559b;border:0.35mm solid #0b0b0c;border-radius:0.3mm;
}

.card .main{flex:1;display:flex;gap:2.4mm;margin-top:2mm;min-height:0}
.card .window{
  width:27mm;flex:none;border:0.6mm solid #0b0b0c;border-radius:1.2mm;
  background:#2f74d8;overflow:hidden;box-shadow:0.9mm 0.9mm 0 rgba(11,11,12,.45);
}
.card .window img{width:100%;height:100%;object-fit:cover;display:block}
.card .col{flex:1;display:flex;flex-direction:column;gap:1.5mm;min-width:0}
.card .type{
  background:#0b0b0c;color:#fdc4e5;border-radius:0.9mm;
  font-family:"Press Start 2P",monospace;font-size:1.25mm;line-height:1;
  padding:1.5mm 1.6mm;letter-spacing:.02em;
}
.card .box{
  flex:1;background:#fdc4e5;color:#0b0b0c;
  border:0.55mm solid #0b0b0c;border-radius:1.2mm;
  padding:1.9mm;display:flex;flex-direction:column;justify-content:center;gap:1.9mm;
}
.card .box .ab{
  display:flex;align-items:center;gap:1.5mm;
  font-family:"Press Start 2P",monospace;font-size:1.5mm;line-height:1.35;
}
.card .box .ab::before{
  content:"";width:1.5mm;height:1.5mm;flex:none;transform:rotate(45deg);
  background:#f6559b;border:0.3mm solid #0b0b0c;
}
.card .box .rule{height:0.3mm;background:rgba(11,11,12,.28);border-radius:999px}
.card .box .flavor{font-size:2mm;line-height:1.25;font-style:italic;color:#8a3f68}

.card .foot{
  display:flex;align-items:center;gap:2mm;margin-top:1.8mm;
  font-family:"Press Start 2P",monospace;font-size:1.2mm;line-height:1;color:#ffffff;
}
.card .foot .set{color:#fdc4e5}
.card .foot .site{margin-left:auto}

.card.back .face{background-color:#1355b3}
.card.back .face::before{
  background-image:
    radial-gradient(circle at 50% 50%, rgba(246,85,155,.55) 0%, rgba(246,85,155,0) 62%),
    repeating-linear-gradient(45deg, rgba(11,11,12,.16) 0 1.6mm, transparent 1.6mm 3.2mm);
}
.card.back .ring{
  position:absolute;z-index:2;inset:1.6mm;border:0.5mm solid rgba(255,255,255,.34);border-radius:1.4mm;
}
.card.back .ring::before{
  content:"";position:absolute;inset:0.9mm;border:0.35mm dashed rgba(255,255,255,.24);border-radius:1mm;
}
.card.back .plate{align-items:center;justify-content:center;padding:3mm}
.card .label{
  position:relative;z-index:3;background:#ffffff;color:#0b0b0c;
  border:0.7mm solid #0b0b0c;border-radius:1.4mm;box-shadow:1.1mm 1.1mm 0 #f6559b;
  transform:rotate(-1.4deg);padding:2.4mm 2.8mm;
  display:flex;align-items:center;gap:2.8mm;
}
.card .label .qrbox{width:16mm;height:16mm;flex:none}
.card .label .qrbox svg{display:block}
.card .contact{display:flex;flex-direction:column;gap:1.8mm;min-width:0}
.card .contact .url{
  font-family:"Press Start 2P",monospace;font-size:2.2mm;line-height:1;white-space:nowrap;
  color:#0b0b0c;
}
.card .contact .line{
  display:flex;align-items:center;gap:1.5mm;white-space:nowrap;
  font-family:"Press Start 2P",monospace;font-size:1.8mm;line-height:1;
}
.card .contact .line .ic{
  width:3.9mm;height:3.9mm;flex:none;border-radius:999px;background:#0b0b0c;color:#ffffff;
  display:flex;align-items:center;justify-content:center;
}
.card .contact .line .ic svg{width:2.5mm;height:2.5mm;display:block}
.card .contact .tail{
  font-family:"Press Start 2P",monospace;font-size:1.15mm;line-height:1;color:#8a3f68;white-space:nowrap;
}


.pack{width:calc(105mm + 2 * var(--bleed));height:calc(148mm + 2 * var(--bleed))}
.pack .band{
  background:#0b0b0c;color:#fdc4e5;
  font-family:"Press Start 2P",monospace;font-size:1.5mm;line-height:1;letter-spacing:.02em;
  padding:calc(1.9mm + var(--bleed)) 2mm 1.9mm;
  margin:calc(-1 * var(--bleed)) calc(-1 * var(--bleed)) 0;
  display:flex;align-items:center;justify-content:center;gap:2mm;
}
.pack .band .dot{width:1.1mm;height:1.1mm;border-radius:999px;background:#f6559b}
.pack .foot{
  background:#0b0b0c;margin:0 calc(-1 * var(--bleed)) calc(-1 * var(--bleed));
  padding:1.9mm 3mm calc(1.9mm + var(--bleed));text-align:center;
  font-family:"Press Start 2P",monospace;font-size:1.3mm;line-height:1;color:#ffffff;letter-spacing:.02em;
}
.pack .foot span{color:#f6559b}
.pack .body{
  flex:1;display:flex;flex-direction:column;justify-content:space-between;
  padding:5mm 6mm;
}
.pack .row{display:flex;align-items:center;gap:4mm}
.pack .stack{display:flex;flex-direction:column;gap:3mm;flex:1}

.st{background:#ffffff;padding:1.1mm;display:flex;align-self:flex-start}
.st > *{
  border:0.7mm solid #0b0b0c;display:flex;align-items:center;justify-content:center;
}
.st.block{width:100%}
.st.block > *{width:100%}
.st.round,.st.round > *{border-radius:999px}
.st.pill{border-radius:3.2mm}
.st.pill > *{border-radius:2.4mm}
.st.plate{border-radius:2.6mm}
.st.plate > *{border-radius:1.8mm}

.s-word > *{
  background:#f6559b;flex-direction:column;gap:1.4mm;padding:3.4mm 2mm;
}
.s-word .mark{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:9.6mm;line-height:.9;
  color:#ffffff;letter-spacing:-.01em;text-shadow:0.8mm 0.8mm 0 #0b0b0c;
}
.s-word .sub{font-family:"Press Start 2P",monospace;font-size:1.5mm;line-height:1;color:#0b0b0c}

.s-mascot{flex:none}
.s-mascot > *{width:30mm;height:30mm;background:#2f74d8;overflow:hidden;padding:0}
.s-mascot img{width:100%;height:100%;object-fit:cover;display:block}

.s-tag > *{
  font-family:"Press Start 2P",monospace;font-size:2.1mm;line-height:1;padding:2.6mm 3mm;white-space:nowrap;
}
.s-tag.white > *{background:#ffffff;color:#0b0b0c}
.s-tag.soft > *{background:#fdc4e5;color:#0b0b0c}
.s-tag.royal > *{background:#2f74d8;color:#ffffff}
.s-tag.pink > *{background:#f6559b;color:#ffffff}

.s-qr{flex:none}
.s-qr > *{width:24mm;height:24mm;background:#ffffff;padding:1.6mm}
.s-qr svg{display:block}
.s-ig svg{width:4.2mm;height:4.2mm;display:block;flex:none}

.s-url > *{
  background:#0b0b0c;color:#ffffff;padding:2.4mm 3mm;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:4.4mm;line-height:1;
  text-shadow:0.45mm 0.45mm 0 #f6559b;
}
.s-ig > *{
  background:#f6559b;color:#ffffff;padding:2.4mm 3mm;gap:1.8mm;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:4.2mm;line-height:1;
  text-shadow:0.45mm 0.45mm 0 #0b0b0c;
}
.s-coin{flex:none}
.s-coin > *{
  width:13.5mm;height:13.5mm;font-family:"Press Start 2P",monospace;font-size:2.3mm;line-height:1;
}
.s-coin.pink > *{background:#f6559b;color:#ffffff}
.s-coin.soft > *{background:#fdc4e5;color:#0b0b0c}
.s-coin.white > *{background:#ffffff;color:#0b0b0c}
