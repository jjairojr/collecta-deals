services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=warning
      - TZ=America/Sao_Paulo
    mem_limit: 1g
    restart: unless-stopped

  opdeals:
    build: .
    container_name: opdeals
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/Sao_Paulo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-web=web/dist", "-schedule", "-schedule-interval", "48h", "-cf-clearance", "data/cf-clearance.json", "-liga-proxy", "http://host.docker.internal:8891", "-lor-deals=false", "-lor-track=false"]
    depends_on:
      - flaresolverr
    restart: unless-stopped
